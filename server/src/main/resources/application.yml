server:
  # 배포 플랫폼이 PORT 환경변수를 주면 그 포트, 없으면 8081 (Vite 개발 서버가 8080)
  port: ${PORT:8081}

relay:
  # 브라우저가 보내는 Origin 헤더가 이 목록에 있어야 연결을 받는다.
  # 배포 환경에서는 RELAY_ALLOWED_ORIGINS=https://a,https://b 로 덮어쓴다.
  allowed-origins:
    - http://localhost:8080
    - https://forest-portfolio-pi.vercel.app
  # 방 하나에 동시에 들어올 수 있는 최대 인원
  room-capacity: 50
  # 세션당 초당 move 메시지 허용 횟수. 넘는 건 버린다 (클라이언트는 15회까지만 보낸다)
  move-rate-per-second: 20
  # 세션당 초당 chat 메시지 허용 횟수 (도배 방지)
  chat-rate-per-second: 2
  # 좌표 허용 범위. 숲은 3840x2160, 점프맵이 더 크므로 넉넉히 잡는다
  bounds:
    min-x: -500
    max-x: 20000
    min-y: -500
    max-y: 20000
